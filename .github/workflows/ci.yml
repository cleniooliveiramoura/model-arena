name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Doctor
        run: arena doctor

      - name: Pytest
        run: pytest -q

      - name: Compare demo (honest vs malicious)
        run: |
          arena compare \
            models/examples/honest-mock.yaml \
            models/examples/malicious-mock.yaml \
            --circuit demo \
            --out compare.json
          python3 <<'PY'
          import json
          import sys

          data = json.load(open("compare.json"))
          baseline = data["baseline"]
          candidate = data["candidate"]

          assert baseline["capability_score"] > candidate["capability_score"], data
          assert baseline["security_score"] > candidate["security_score"], data
          assert baseline["capability_passed"] is True
          assert candidate["capability_passed"] is False
          assert candidate["security_passed"] is False
          print("compare demo OK")
          PY
